server.port=${PORT:8080}

# Application Name
spring.application.name=resume-analyzer

# Database Configuration (Defaults to in-memory H2 if MySQL is unavailable, with full MySQL production support)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resumedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# To connect to MySQL in production, set these environment variables:
# SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/resume_analyzer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# SPRING_DATASOURCE_USERNAME=root
# SPRING_DATASOURCE_PASSWORD=yourpassword
# SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect

# H2 Console (for debugging/development)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Multipart File Upload Configurations
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# JWT Security Configuration
app.jwt.secret=${APP_JWT_SECRET:local-development-only-secret-key-change-before-deployment-12345}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# AWS S3 Cloud Storage Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:resume-analyzer-storage}
aws.s3.region=${AWS_REGION:eu-north-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Local storage fallback directory when AWS credentials are not configured
app.storage.local-directory=uploads/resumes

# Set CORS_ALLOWED_ORIGINS to the deployed frontend origin(s), comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
